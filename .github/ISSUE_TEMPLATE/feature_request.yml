name: Proponer una mejora
description: Proponer una mejora alineada con el alcance del MVP.
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Necesidad o problema
      description: ¿Qué tarea del comercio se dificulta hoy?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Cambio propuesto
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Resultado verificable
      description: ¿Cómo sabremos que la mejora funciona?
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Revisión
      options:
        - label: Revisé el alcance vigente y usé ejemplos sin información real.
          required: true
